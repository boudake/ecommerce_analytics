# This is a Declarative Automation Bundle definition for ecommerce_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ecommerce_bundle
  uuid: 7929a2c0-f127-46a5-beba-a67c653195e3

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9aed42fa-dfb9.cloud.databricks.com
    variables:
      catalog: dev_bundle
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-9aed42fa-dfb9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/dmddubai221@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/dmddubai221@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_bundle
      schema: prod
    permissions:
      - user_name: dmddubai221@gmail.com
        level: CAN_MANAGE
